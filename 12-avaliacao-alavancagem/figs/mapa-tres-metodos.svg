<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Mapa dos três métodos</title>
  <desc id="desc">WACC, APV e FCFE avaliam o mesmo projeto alavancado e dão o mesmo VPL.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b0aea5" stroke="#5f5e5a"/>
    </marker>
  </defs>
  <!-- Texto SVG nativo: não depende de HTML, MathJax ou fontes de matemática. -->
  <g fill="none" stroke="#b0aea5" stroke-width="1.5" marker-end="url(#seta)">
    <path d="M 230 210 C 320 110, 350 75, 420 75"/>
    <path d="M 285 250 H 420"/>
    <path d="M 230 290 C 320 390, 350 425, 420 425"/>
    <path d="M 720 75 C 780 75, 800 150, 880 210"/>
    <path d="M 720 250 H 850"/>
    <path d="M 720 425 C 780 425, 800 350, 880 290"/>
  </g>
  <g fill="#e6ecf4" stroke="#40403d" stroke-width="1.5">
    <rect x="20" y="210" width="265" height="80"/>
    <rect x="420" y="15" width="300" height="120"/>
    <rect x="420" y="185" width="300" height="130"/>
    <rect x="420" y="365" width="300" height="120"/>
    <rect x="850" y="210" width="240" height="80"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="23" text-anchor="middle" fill="#2878dc">
    <text x="152.5" y="258">Projeto alavancado</text>
    <text x="570" y="53">WACC:</text>
    <text x="570" y="81">desconta FCF</text>
    <text x="570" y="109">a <tspan font-style="italic">r</tspan><tspan dy="5" font-size="16">wacc</tspan></text>
    <text x="570" y="216">APV:</text>
    <text x="570" y="244">FCF desalavancado</text>
    <text x="570" y="272">a <tspan font-style="italic">r</tspan><tspan dy="5" font-size="16">U</tspan><tspan dy="-5"> +</tspan></text>
    <text x="570" y="300">PV(tax shield)</text>
    <text x="570" y="403">FCFE:</text>
    <text x="570" y="431">fluxo do acionista</text>
    <text x="570" y="459">a <tspan font-style="italic">r</tspan><tspan dy="5" font-size="16">E</tspan></text>
    <text x="970" y="258">Mesmo VPL</text>
  </g>
</svg>
